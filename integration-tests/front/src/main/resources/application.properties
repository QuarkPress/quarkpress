# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKWORD_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkword".db-kind=${QUARKWORD_TEST_DB:${testDb:postgresql}}
# A single site (no multisite module): the main site, localhost at /, comes from the persistence migrations.
# Dev Services for Keycloak imports the security module's dev realm (its Dev Services keys ship with the module).
# alice is made administrator of the main site at every start (a single site has no network administrators).
quarkword.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# The front end needs no setting of its own: the site's home, siteurl and permalink_structure options drive it, and the
# tests set them. Its catch-all route serves every GET and HEAD that the REST API, the setup resources and the uploads
# route left unanswered.
# The tests' requests reach the application as http://localhost (Host: localhost); a proxy's X-Forwarded-Proto would be
# trusted from the loopback, as behind a TLS-terminating proxy.
quarkus.http.proxy.proxy-address-forwarding=true
# The filesystem storage keeps the uploads in the build folder and its route serves them under /wp-content/uploads.
quarkword.media.fs.directory=target/media-files
# Keycloak can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
