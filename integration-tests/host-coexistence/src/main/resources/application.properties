# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# The host application: default datasource, its own entities, its own Flyway on db/migration.
# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource.db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
quarkus.hibernate-orm.packages=com.example.erp
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
# Whichever Flyway runs second finds a non-empty schema; both sides start their history at version 0.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# QuarkPress: its own datasource, pointed at the host's database.
# The host's own settings use another prefix: quarkpress.* is reserved for QuarkPress.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
quarkus.datasource."quarkpress".devservices.enabled=false
quarkus.datasource."quarkpress".jdbc.url=${quarkus.datasource.jdbc.url:}
quarkus.datasource."quarkpress".username=${quarkus.datasource.username:}
quarkus.datasource."quarkpress".password=${quarkus.datasource.password:}
