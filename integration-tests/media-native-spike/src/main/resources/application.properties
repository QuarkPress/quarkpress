# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# Native registrations for the M2a media spike (see NativeRegistrations and the spike report).
# ImageIO finds the TwelveMonkeys plugins through ServiceLoader; Quarkus does not register services automatically.
# Tika's default detector loads its MIME database from tika-mimetypes.xml (and an optional custom-mimetypes.xml).
quarkus.native.resources.includes=META-INF/services/javax.imageio.spi.*,org/apache/tika/mime/*.xml
# TwelveMonkeys classes touch java.awt/javax.imageio (run-time initialized by quarkus-awt) from static initializers,
# so they are initialized at run time too.
quarkus.native.additional-build-args=--initialize-at-run-time=com.twelvemonkeys
