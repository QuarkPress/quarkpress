# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
# A network: the tests upload on the main site (localhost at /).
quarkpress.multisite.enabled=true
# Dev Services for Keycloak imports the security module's dev realm (its Dev Services keys ship with the module).
# alice, the realm's network administrator, is made one at every start.
quarkpress.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# The filesystem storage keeps the uploads in the build folder and its route serves them under /wp-content/uploads.
# This directory is the default for quarkus:dev and a packaged run; the tests replace it with a new empty directory
# for each start (MediaFilesResource), so file names never depend on an earlier run.
# Processing is synchronous (MediaVipsAsyncDbTest switches to async). The image processor is libvips's, with ImageIO's
# as its fallback for the types libvips does not decode (BMP); no choice is made, so libvips takes precedence.
quarkpress.media.fs.directory=target/media-files
# Two libvips worker threads per image: the tests run beside other modules' builds.
quarkus.libvips.concurrency=2
# The tests fail on an image left open: quarkus-libvips reports images never closed when the application stops.
%test.quarkus.libvips.leak-check=true
# Keycloak can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
