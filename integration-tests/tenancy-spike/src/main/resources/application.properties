# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# The default datasource is not used.
quarkus.datasource.devservices.enabled=false

# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}

quarkus.hibernate-orm."quarkpress".datasource=quarkpress
quarkus.hibernate-orm."quarkpress".packages=org.quarkpress.it.tenancy
quarkus.hibernate-orm."quarkpress".schema-management.strategy=none
quarkus.hibernate-orm."quarkpress".mapping.timezone.default-storage=normalize-utc
quarkus.hibernate-orm."quarkpress".jdbc.timezone=UTC

quarkus.flyway."quarkpress".migrate-at-start=true
quarkus.flyway."quarkpress".table=qp_schema_history
quarkus.flyway."quarkpress".locations=db/spike/${QUARKPRESS_TEST_DB:${testDb:postgresql}}
