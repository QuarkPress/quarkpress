# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# The default datasource is not used.
quarkus.datasource.devservices.enabled=false

# The test database: env QUARKWORD_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkword".db-kind=${QUARKWORD_TEST_DB:${testDb:postgresql}}

quarkus.hibernate-orm."quarkword".datasource=quarkword
quarkus.hibernate-orm."quarkword".packages=org.quarkword.it.tenancy
quarkus.hibernate-orm."quarkword".schema-management.strategy=none
quarkus.hibernate-orm."quarkword".mapping.timezone.default-storage=normalize-utc
quarkus.hibernate-orm."quarkword".jdbc.timezone=UTC

quarkus.flyway."quarkword".migrate-at-start=true
quarkus.flyway."quarkword".table=qw_schema_history
quarkus.flyway."quarkword".locations=db/spike/${QUARKWORD_TEST_DB:${testDb:postgresql}}
