# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKWORD_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkword".db-kind=${QUARKWORD_TEST_DB:${testDb:postgresql}}
# A single site (no multisite module). Dev Services for Keycloak imports the security module's dev realm (its Dev
# Services keys ship with the module); alice is made administrator of the main site at every start.
quarkword.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# Dev Services' Keycloak gets the quarkword-keycloak password-hash provider, which verifies the imported WordPress
# hashes: the jar (the test JVM's system property keycloakProviderJar, set by this module's POM) is mounted into
# Keycloak's providers folder, and Dev Services' "start" command builds it in. The start command is left as Dev
# Services sets it: it also maps Dev Services' user profile, in which e-mail, first and last name are optional.
quarkus.keycloak.devservices.resource-aliases.wp-password=${keycloakProviderJar:keycloakProviderJar-is-not-set}
quarkus.keycloak.devservices.resource-mappings.wp-password=/opt/keycloak/providers/quarkword-keycloak-wp-password.jar
# Never reuse a Keycloak another application started: it would not have the provider.
quarkus.keycloak.devservices.shared=false
# Keycloak can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
