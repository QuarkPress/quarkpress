# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The synchronous S3 client on the JDK's URL connection (software.amazon.awssdk:url-connection-client); no Apache,
# Netty or CRT client is on the classpath.
quarkus.s3.sync-client.type=url
# Dev Services for S3 start moto, pinned, and create the bucket. They hand the application the endpoint, the region,
# static credentials and path-style access (the keys quarkus.s3.endpoint-override etc. must stay unset here, as
# setting the endpoint turns Dev Services off).
quarkus.s3.devservices.provider=moto
quarkus.aws.devservices.moto.image-name=motoserver/moto:5.2.5
quarkus.s3.devservices.buckets=quarkpress-media
# The bucket the spike resource uses: the one Dev Services create.
it.s3.bucket=quarkpress-media
# Containers can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
