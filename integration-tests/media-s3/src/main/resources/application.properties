# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
# A network: the tests upload on the main site (localhost at /) and on a site in a subdirectory, whose files are kept
# under sites/<id>/.
quarkpress.multisite.enabled=true
# Dev Services for Keycloak imports the security module's dev realm (its Dev Services keys ship with the module).
# alice, the realm's network administrator, is made one at every start.
quarkpress.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# The synchronous S3 client on the JDK's URL connection (software.amazon.awssdk:url-connection-client); no Apache,
# Netty or CRT client is on the classpath.
quarkus.s3.sync-client.type=url
# Dev Services for S3 start moto, pinned, and create the bucket. They hand the application the endpoint, the region,
# static credentials and path-style access (the keys quarkus.s3.endpoint-override etc. must stay unset here, as
# setting the endpoint turns Dev Services off).
quarkus.s3.devservices.provider=moto
quarkus.aws.devservices.moto.image-name=motoserver/moto:5.2.5
quarkus.s3.devservices.buckets=quarkpress-media
# The media files go to the bucket Dev Services create; the tests give each start its own key prefix
# (S3PrefixResource), so file names never depend on an earlier run. Files are served by S3 through presigned URLs,
# valid for an hour. The media module needs no other setting: processing is synchronous and the image processor is
# ImageIO's.
quarkpress.media.s3.bucket=quarkpress-media
quarkpress.media.s3.presigned-url-ttl=PT1H
# Containers can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
