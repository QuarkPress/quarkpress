# Random ports: integration-test modules run at the same time under -T4.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
# A network: the multisite module's own configuration already turns it on; it is stated here because the tests depend
# on the network's shape (sites in subdirectories of localhost serve their own REST API, and the settings have no url
# or email). The main site, localhost at /, comes from the persistence migrations; the network needs no other setting.
quarkpress.multisite.enabled=true
# Dev Services for Keycloak imports the security module's dev realm (its Dev Services keys ship with the module).
# alice, the realm's network administrator, is made one at every start.
quarkpress.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# The REST API needs no setting of its own: it serves /wp-json and ?rest_route= on every site, as its defaults say.
# The taxonomy module's migration creates each existing site's default category; a new site gets its own.
# Nothing here waits for scheduled posts: the scheduler stays off.
quarkus.scheduler.enabled=false
# Keycloak can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
