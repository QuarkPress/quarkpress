# The QuarkPress side of the Tier B comparison: the multisite, security, posts, taxonomy, revisions and scheduling
# extensions on QuarkPress's datasource.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKPRESS_TEST_DB in the test JVM (the Surefire configuration sets it from -DtestDb).
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}

# The security module checks capabilities; the runner acts as the system identity and needs no OIDC server.
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false

# The scheduling module's jobs are called by the runner; the scheduler must not poll during a comparison.
quarkus.scheduler.enabled=false
