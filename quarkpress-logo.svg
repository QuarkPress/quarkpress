<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-labelledby="t">
  <title id="t">QuarkPress</title>
  <style>
    .ink { fill: none; stroke: #1E2A3A; }
    .nib { fill: #E8553D; }
    .word { fill: #1E2A3A; font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 62px; letter-spacing: -1.5px; }
    .accent { fill: #E8553D; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #E9EEF5; } .word { fill: #E9EEF5; } .word .accent { fill: #E8553D; } }
  </style>
  <!-- Q ring, open where the pen nib (the Q's tail) crosses it -->
  <path class="ink" d="M 71.6 93.5 A 38 38 0 1 1 93.5 71.6" stroke-width="13"/>
  <!-- Pen nib with breather hole and slit -->
  <path class="nib" fill-rule="evenodd" transform="translate(90 90) rotate(-45)" d="M -11 -24 Q -11 -30 -5 -30 L 5 -30 Q 11 -30 11 -24 L 11 -8 C 11 6 4 18 0 30 C -4 18 -11 6 -11 -8 Z M -1.1 -3.57 A 3.6 3.6 0 1 1 1.1 -3.57 L 1.1 20 L -1.1 20 Z"/>
  <text class="word" x="134" y="81">Quark<tspan class="accent">Press</tspan></text>
</svg>
