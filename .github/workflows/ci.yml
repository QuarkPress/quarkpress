name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: shivammathur/setup-php@2.37.2
        if: matrix.java == 21
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, pcntl, iconv, xml, dom, simplexml, xmlreader, hash, sodium, mysqli, pdo_mysql, gd, exif, fileinfo, :imagick
          coverage: none
      - name: Build and test (Gutenberg conformance and WordPress parity)
        if: matrix.java == 21 && matrix.db == 'postgresql'
        run: mvn -B -ntp verify -Pconformance,wp-parity -Dwp.media.require-editor=true -DtestDb=${{ matrix.db }}
      - name: Build and test
        if: matrix.java != 21 || matrix.db != 'postgresql'
        run: mvn -B -ntp verify -DtestDb=${{ matrix.db }}
      - name: WordPress parity on MySQL
        if: matrix.java == 21 && matrix.db == 'mysql'
        run: mvn -B -ntp -pl integration-tests/rest-wp-v2,integration-tests/media -am verify -Pwp-parity -Dtest='RestParityDbTest,MediaParityDbTest' -Dsurefire.failIfNoSpecifiedTests=false -Dwp.media.require-editor=true -DtestDb=mysql
      - name: Check formatting
        if: matrix.java == 21 && matrix.db == 'postgresql'
        run: mvn -B -ntp spotless:check
