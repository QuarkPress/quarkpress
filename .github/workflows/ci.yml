name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.db }}
    # the libvips package names below are Ubuntu 24.04's
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Keep in step with native.yml's native-vips job: the same pin, checkout, libvips packages and quarkus-libvips
      # install (that job adds the AWT libraries).
      - name: Read the quarkus-libvips pin
        if: matrix.java == 25
        run: |
          pin="$(sed -n 's:.*<quarkus-libvips.commit>\(.*\)</quarkus-libvips.commit>.*:\1:p' pom.xml)"
          [ "${#pin}" -eq 40 ] || { echo "::error::quarkus-libvips.commit not found in pom.xml"; exit 1; }
          echo "QUARKUS_LIBVIPS_COMMIT=$pin" >> "$GITHUB_ENV"
      # quarkus-libvips is not on Maven Central yet: built from the pinned commit (the admin repository's way).
      - uses: actions/checkout@v4
        if: matrix.java == 25
        with:
          repository: SiteNetSoft/quarkus-libvips
          ref: ${{ env.QUARKUS_LIBVIPS_COMMIT }}
          path: .quarkus-libvips
      - name: Install libvips
        if: matrix.java == 25
        run: |
          sudo apt-get update -q
          # libheif-plugin-libde265 is only Suggested by noble's libheif1: without it HEIC decodes silently black.
          # libheif-plugin-aomenc writes AVIF. libvips-tools carries the `vips` CLI used below.
          sudo apt-get install -y -q libvips42t64 libvips-tools libheif-plugin-aomenc libheif-plugin-libde265
          lib="$(ldconfig -p | awk '/libvips\.so\.42 / { print $NF; exit }')"
          [ -n "$lib" ] || { echo "::error::libvips.so.42 not found after install"; exit 1; }
          dpkg -l | awk '/libvips42|libheif|libcgif/ { print $2, $3 }'
          vips -l | grep -E 'gifsave_buffer|heifsave_buffer|heifload |webpsave_buffer|tiffsave_buffer' || true
          # Not exported as QUARKUS_LIBVIPS_LIBRARY: quarkus-libvips finds libvips.so.42 by its soname, and an
          # environment value would override the tests that point quarkus.libvips.library at a missing file.
      - name: Install quarkus-libvips at the pinned commit
        if: matrix.java == 25
        # setup-java's Maven cache restores ~/.m2 with any earlier install: remove it so a changed pin is never hidden.
        # A build of that checkout reads its own .mvn/, not ours: the retry settings of ours are passed here.
        env:
          MAVEN_ARGS: >-
            -Daether.connector.http.retryHandler.count=8 -Daether.connector.http.retryHandler.interval=10000
            -Daether.connector.http.retryHandler.serviceUnavailable=429,503
        run: |
          rm -rf ~/.m2/repository/org/sitenetsoft/quarkus-libvips*
          mvn -B -ntp install -DskipTests -f .quarkus-libvips/pom.xml -pl runtime,deployment -am
      # Keep in step with native.yml's keycloak steps: the same pin, checkout, installs and package. The JDK 21 cells
      # run integration-tests/keycloak's end-to-end sign-in against Dev Services' Keycloak with the provider mounted;
      # on JDK 25 it is skipped (no checkout, requireKeycloakProvider unset).
      - name: Read the quarkword-keycloak pin
        if: matrix.java == 21
        run: |
          pin="$(sed -n 's:.*<quarkword-keycloak.commit>\(.*\)</quarkword-keycloak.commit>.*:\1:p' pom.xml)"
          [ "${#pin}" -eq 40 ] || { echo "::error::quarkword-keycloak.commit not found in pom.xml"; exit 1; }
          echo "QUARKWORD_KEYCLOAK_COMMIT=$pin" >> "$GITHUB_ENV"
      # The provider is not on Maven Central: packaged from the pinned commit. The checkout stays inside the workspace
      # (.quarkword-keycloak/ is ignored by git and is no module of this build).
      - uses: actions/checkout@v4
        if: matrix.java == 21
        with:
          repository: QuarkWord/quarkword-keycloak
          ref: ${{ env.QUARKWORD_KEYCLOAK_COMMIT }}
          path: .quarkword-keycloak
      - name: Package the Keycloak provider at the pinned commit
        if: matrix.java == 21
        # the provider shades lib-wp-password: installed first from this checkout (the main build only verifies).
        # setup-java's Maven cache restores ~/.m2 with any earlier install: remove it so a changed pin is never hidden
        run: |
          rm -rf ~/.m2/repository/org/quarkword/keycloak
          mvn -B -ntp install -DskipTests -pl libs/wp-password,testing/test-gen -am
          mvn -B -ntp package -DskipTests -f .quarkword-keycloak/pom.xml
      # PHP for WordPress, the parity runs' reference: GD is its image editor, Imagick is left out
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, pcntl, iconv, xml, dom, simplexml, xmlreader, hash, sodium, mysqli, pdo_mysql, gd, exif, fileinfo, :imagick
          coverage: none
      - name: Build and test (Gutenberg conformance and WordPress parity)
        if: matrix.java == 21 && matrix.db == 'postgresql'
        run: |
          mvn -B -ntp verify -Pconformance,wp-parity -Dwp.media.require-editor=true -DtestDb=${{ matrix.db }} \
            -DquarkwordKeycloakDir=$GITHUB_WORKSPACE/.quarkword-keycloak -DrequireKeycloakProvider=true
          bash .github/scripts/require-tests-ran.sh \
            integration-tests/rest-wp-v2/target/surefire-reports/TEST-org.quarkword.it.restwp.RestParityDbTest.xml \
            integration-tests/media/target/surefire-reports/TEST-org.quarkword.it.media.MediaParityDbTest.xml \
            libs/wp-formatting/target/surefire-reports/TEST-org.quarkword.lib.wpformatting.FormattingParityTest.xml
      - name: Build and test
        if: matrix.java != 21 || matrix.db != 'postgresql'
        # on JDK 25 the vips module is built, and its tests fail rather than skip when libvips lacks a format; on JDK 21
        # the Keycloak end-to-end tests fail rather than skip without the packaged provider
        run: >-
          mvn -B -ntp verify -DtestDb=${{ matrix.db }}
          ${{ matrix.java == 25 && '-Dvips.require-all-formats=true' || '' }}
          ${{ matrix.java == 21 && '-DquarkwordKeycloakDir=$GITHUB_WORKSPACE/.quarkword-keycloak -DrequireKeycloakProvider=true' || '' }}
      - name: WordPress parity on MySQL
        if: matrix.java == 21 && matrix.db == 'mysql'
        # the upstream modules have none of the named tests, hence failIfNoSpecifiedTests=false; the reports, removed
        # first (the step before wrote skipped ones), must then show that both parity tests ran
        run: |
          rm -f integration-tests/rest-wp-v2/target/surefire-reports/TEST-*ParityDbTest.xml \
            integration-tests/media/target/surefire-reports/TEST-*ParityDbTest.xml
          mvn -B -ntp -pl integration-tests/rest-wp-v2,integration-tests/media -am verify -Pwp-parity -Dtest='RestParityDbTest,MediaParityDbTest' -Dsurefire.failIfNoSpecifiedTests=false -Dwp.media.require-editor=true -DtestDb=mysql
          bash .github/scripts/require-tests-ran.sh \
            integration-tests/rest-wp-v2/target/surefire-reports/TEST-org.quarkword.it.restwp.RestParityDbTest.xml \
            integration-tests/media/target/surefire-reports/TEST-org.quarkword.it.media.MediaParityDbTest.xml
      - name: WordPress libvips media parity
        if: matrix.java == 25
        # as the JDK 21 step above: the report, removed first (the build wrote a skipped one), must show the test ran;
        # -DskipITs, because the build step already ran the Failsafe integration tests
        run: |
          rm -f integration-tests/media-vips/target/surefire-reports/TEST-*ParityDbTest.xml
          mvn -B -ntp -pl integration-tests/media-vips -am verify -DskipITs -Pwp-parity -Dtest=MediaVipsParityDbTest -Dsurefire.failIfNoSpecifiedTests=false -Dwp.media.require-editor=true -Dvips.require-all-formats=true -DtestDb=${{ matrix.db }}
          bash .github/scripts/require-tests-ran.sh \
            integration-tests/media-vips/target/surefire-reports/TEST-org.quarkword.it.mediavips.MediaVipsParityDbTest.xml
      - name: Check that the Keycloak end-to-end tests ran
        if: matrix.java == 21
        # a renamed, filtered-out or skipped end-to-end test must not let the build pass
        run: |
          reports=integration-tests/keycloak/target
          bash .github/scripts/require-tests-ran.sh \
            "$reports/surefire-reports/TEST-org.quarkword.it.keycloak.KeycloakE2EDbTest.xml" \
            "$reports/failsafe-reports/TEST-org.quarkword.it.keycloak.KeycloakE2EIT.xml"
      - name: Check formatting
        if: matrix.java == 21 && matrix.db == 'postgresql'
        run: mvn -B -ntp spotless:check
      - name: Check formatting (Java 25 modules)
        # the step above runs on JDK 21, whose reactor leaves these modules out
        if: matrix.java == 25 && matrix.db == 'postgresql'
        run: mvn -B -ntp spotless:check -pl extensions/media-image-vips/runtime,extensions/media-image-vips/deployment,integration-tests/media-vips
