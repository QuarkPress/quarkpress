name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none
      - name: Build and test (Gutenberg conformance and WordPress parity)
        run: mvn -B -ntp verify -Pconformance,wp-parity
      - name: Check formatting
        run: mvn -B -ntp spotless:check
