name: Native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'extensions/**'
      - 'integration-tests/**'
      - 'bom/**'
      - 'pom.xml'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
    env:
      IT_MODULES: integration-tests/tenancy-spike,integration-tests/content,integration-tests/multisite,integration-tests/host-coexistence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install the modules the integration tests use
        run: mvn -B -ntp install -DskipTests -pl "$IT_MODULES" -am
      - name: Build native executables and run the integration tests
        run: >-
          mvn -B -ntp verify -fae -Dnative -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=mandrel -DskipUnitTests=true
          -DtestDb=${{ matrix.db }} -pl "$IT_MODULES"
