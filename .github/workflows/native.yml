name: Native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'extensions/**'
      - 'libs/**'
      - 'integration-tests/**'
      - 'bom/**'
      - 'pom.xml'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
    env:
      IT_MODULES: integration-tests/tenancy-spike,integration-tests/content,integration-tests/multisite,integration-tests/security,integration-tests/posts,integration-tests/host-coexistence,integration-tests/rest-wp-v2,integration-tests/media-native-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # quarkus-awt (media-native-spike): the native executable loads the AWT shared libraries copied next to it, which
      # need FreeType and fontconfig on the host that runs it. Usually preinstalled on ubuntu-latest; made explicit here.
      - name: Install the AWT runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfreetype6 fontconfig
      - name: Install the modules the integration tests use
        run: mvn -B -ntp install -DskipTests -pl "$IT_MODULES" -am
      # The posts image carries the taxonomy, revisions and scheduling modules too; its multi-node test launches the same executable a second time.
      # The rest-wp-v2 image serves WordPress's REST API (wp/v2) on a network with the same content modules.
      # One native image at a time: .mvn/maven.config's -T4 would build all eight at once, which exhausts the runner.
      # The media-native-spike image (M2a spike) checks ImageIO with TwelveMonkeys, Tika and metadata-extractor.
      - name: Build native executables and run the integration tests
        run: >-
          mvn -B -ntp -T1 verify -fae -Dnative -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=mandrel -DskipUnitTests=true
          -DtestDb=${{ matrix.db }} -pl "$IT_MODULES"
