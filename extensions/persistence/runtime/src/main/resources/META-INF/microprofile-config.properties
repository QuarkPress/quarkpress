# Defaults for QuarkPress's own datasource and persistence unit, both named "quarkpress".
# These have ordinal 100; the application's application.properties (250) overrides any of them.
# The application sets quarkus.datasource."quarkpress".db-kind and, in production, its JDBC URL and credentials.
quarkus.hibernate-orm."quarkpress".datasource=quarkpress
quarkus.hibernate-orm."quarkpress".packages=org.quarkpress
quarkus.hibernate-orm."quarkpress".schema-management.strategy=none
quarkus.hibernate-orm."quarkpress".mapping.timezone.default-storage=normalize-utc
quarkus.hibernate-orm."quarkpress".jdbc.timezone=UTC
# Shared caches would hand one site's rows to another (they bypass the site filter): second-level and query caches
# stay off for this unit and must not be turned back on.
quarkus.hibernate-orm."quarkpress".second-level-caching-enabled=false
quarkus.flyway."quarkpress".migrate-at-start=true
quarkus.flyway."quarkpress".table=qp_schema_history
quarkus.flyway."quarkpress".out-of-order=true
quarkus.flyway."quarkpress".locations=db/quarkpress/common,db/quarkpress/${quarkpress.persistence.migration-vendor}
# QuarkPress may share a database the application already migrated: start its own history at version 0,
# so every V1_* script still runs.
quarkus.flyway."quarkpress".baseline-on-migrate=true
quarkus.flyway."quarkpress".baseline-version=0
# The folder of vendor-specific migrations; "missing" lets the build report an unset db-kind clearly.
quarkpress.persistence.migration-vendor=${quarkus.datasource."quarkpress".db-kind:missing}
