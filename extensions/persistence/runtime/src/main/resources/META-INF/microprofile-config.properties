# Defaults for QuarkWord's own datasource and persistence unit, both named "quarkword".
# These have ordinal 100; the application's application.properties (250) overrides any of them.
# The application sets quarkus.datasource."quarkword".db-kind and, in production, its JDBC URL and credentials.
quarkus.hibernate-orm."quarkword".datasource=quarkword
quarkus.hibernate-orm."quarkword".packages=org.quarkword
quarkus.hibernate-orm."quarkword".schema-management.strategy=none
quarkus.hibernate-orm."quarkword".mapping.timezone.default-storage=normalize-utc
quarkus.hibernate-orm."quarkword".jdbc.timezone=UTC
# Shared caches would hand one site's rows to another (they bypass the site filter): second-level and query caches
# stay off for this unit and must not be turned back on.
quarkus.hibernate-orm."quarkword".second-level-caching-enabled=false
# Transactions read committed data on both databases (PostgreSQL's default; MySQL would use REPEATABLE READ). On
# MySQL, locking reads then lock only the rows they find, not gaps that rows of other sites share, and a plain read
# made after a lock sees what was committed before it.
quarkus.datasource."quarkword".jdbc.transaction-isolation-level=read-committed
quarkus.flyway."quarkword".migrate-at-start=true
quarkus.flyway."quarkword".table=qw_schema_history
quarkus.flyway."quarkword".out-of-order=true
quarkus.flyway."quarkword".locations=db/quarkword/common,db/quarkword/${quarkword.persistence.migration-vendor}
# QuarkWord may share a database the application already migrated: start its own history at version 0,
# so every V1_* script still runs.
quarkus.flyway."quarkword".baseline-on-migrate=true
quarkus.flyway."quarkword".baseline-version=0
# The folder of vendor-specific migrations; "missing" lets the build report an unset db-kind clearly.
quarkword.persistence.migration-vendor=${quarkus.datasource."quarkword".db-kind:missing}
