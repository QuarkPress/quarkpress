# In dev and test, users are created in the realm Dev Services for Keycloak imports (the security module's dev realm,
# through Dev Services' own admin). Ordinal 100: an application's application.properties (250) overrides this.
%dev.quarkpress.keycloak-provisioner.realm=${quarkus.keycloak.devservices.realm-name:quarkpress}
%test.quarkpress.keycloak-provisioner.realm=${quarkus.keycloak.devservices.realm-name:quarkpress}
