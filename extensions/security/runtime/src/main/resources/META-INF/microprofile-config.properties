# Dev Services for Keycloak (dev and test) imports QuarkPress's dev realm: users alice, bob, carol, dave and erin,
# each with their user name as password, and the client quarkus-app (secret "secret"). The realm and its passwords
# are dev-only fixtures: never use them outside Dev Services. Ordinal 100: an application's application.properties
# (250) overrides these.
quarkus.keycloak.devservices.realm-path=quarkpress-dev-realm.json
quarkus.keycloak.devservices.realm-name=quarkpress
